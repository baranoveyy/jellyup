<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JellyUp</title>
<meta name="description" content="A friend challenged you in JellyUp.">
<meta property="og:title" content="JellyUp — a friend challenged you">
<meta property="og:description" content="Tap to open the challenge in the game.">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #2a1b3d; --card: #3b2856; --ink: #fff7fb; --soft: #cdb9e6;
    --jelly: #5fd38a; --jelly-dark: #2f9a5a; --accent: #ffcf4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #4a2f6e 0%, var(--bg) 60%);
    color: var(--ink); font: 16px/1.4 -apple-system, "Nunito", "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  .jelly {
    width: 96px; height: 84px; margin: 0 auto 12px; position: relative;
    background: var(--jelly); border-radius: 48% 48% 40% 40% / 60% 60% 40% 40%;
    box-shadow: inset -10px -12px 0 rgba(0,0,0,.12), inset 8px 10px 0 rgba(255,255,255,.25);
    animation: bob 1.6s ease-in-out infinite;
  }
  .jelly::before, .jelly::after {
    content: ""; position: absolute; top: 30px; width: 14px; height: 18px; border-radius: 50%; background: #1d1430;
  }
  .jelly::before { left: 28px; } .jelly::after { right: 28px; }
  @keyframes bob { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-10px) scale(.96,1.05); } }
  @media (prefers-reduced-motion: reduce) { .jelly { animation: none; } }
  h1 { font-size: 28px; margin: 0 0 4px; font-weight: 900; }
  p { color: var(--soft); margin: 0 0 20px; }
  .btn {
    display: block; width: 100%; padding: 16px; border: 0; border-radius: 16px; min-height: 52px;
    font-family: inherit; font-size: 18px; font-weight: 800; line-height: 1.2; text-decoration: none; cursor: pointer;
  }
  .primary { background: var(--jelly); color: #10331f; box-shadow: 0 5px 0 var(--jelly-dark); }
  .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--jelly-dark); }
  .card { background: var(--card); border-radius: 18px; padding: 16px; margin-top: 22px; text-align: left; }
  .card h2 { font-size: 15px; margin: 0 0 8px; }
  .card ol { margin: 0 0 12px; padding-left: 20px; color: var(--soft); font-size: 14px; }
  .code {
    font: 12px/1.3 ui-monospace, Menlo, monospace; color: var(--ink); background: rgba(0,0,0,.25);
    border-radius: 10px; padding: 10px; word-break: break-all; max-height: 72px; overflow: hidden;
  }
  .secondary { margin-top: 10px; background: transparent; color: var(--ink); border: 2px solid var(--soft); padding: 12px; font-size: 16px; font-weight: 700; min-height: 48px; }
  .stores { margin-top: 16px; font-size: 13px; color: var(--soft); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="jelly" aria-hidden="true"></div>
  <h1 id="title">JellyUp</h1>
  <p id="lead">A friend challenged you. Tap to open it in the game.</p>
  <a id="open" class="btn primary" href="jellyup://c/">Open in JellyUp</a>

  <section class="card" id="manual">
    <h2 id="manual-title">Didn't open?</h2>
    <ol>
      <li id="step1">Copy the code below.</li>
      <li id="step2">Open JellyUp and tap League › Paste a code.</li>
    </ol>
    <div class="code" id="code"></div>
    <button class="btn secondary" id="copy" type="button">Copy the code</button>
  </section>

  <div class="stores" id="stores">Coming soon to the App Store and Google Play.</div>
</main>
<script>
(function () {
  // The code rides in the fragment (#...), which browsers never send to this page's host.
  var raw = location.hash.replace(/^#/, "");
  var code = "";
  try { code = decodeURIComponent(raw); } catch (e) { code = raw; }
  code = code.replace(/[^\p{L}\p{N}._\-]/gu, "").slice(0, 4000);

  var tr = (navigator.language || "").toLowerCase().indexOf("tr") === 0;
  var group = /^JUP-/.test(code);
  var t = tr ? {
    lead: group ? "Bir arkadaşın seni grubuna çağırdı. Dokun, oyunda katıl." : "Bir arkadaşın sana meydan okudu. Dokun, oyunda aç.",
    open: "JellyUp'ta aç", manual: "Açılmadı mı?", step1: "Aşağıdaki kodu kopyala.",
    step2: group ? "JellyUp'ı aç, Grup › Kod yapıştır'a dokun." : "JellyUp'ı aç, Lig › Kod yapıştır'a dokun.",
    copy: "Kodu kopyala", copied: "Kopyalandı ✓", stores: "Yakında App Store ve Google Play'de.",
    none: "Bu linkte kod yok. Arkadaşından linki yeniden göndermesini iste.", title: "JellyUp"
  } : {
    lead: group ? "A friend invited you to their group. Tap to join in the game." : "A friend challenged you. Tap to open it in the game.",
    open: "Open in JellyUp", manual: "Didn't open?", step1: "Copy the code below.",
    step2: group ? "Open JellyUp and tap Group › Paste a code." : "Open JellyUp and tap League › Paste a code.",
    copy: "Copy the code", copied: "Copied ✓", stores: "Coming soon to the App Store and Google Play.",
    none: "This link has no code. Ask your friend to send it again.", title: "JellyUp"
  };
  document.documentElement.lang = tr ? "tr" : "en";
  document.title = t.title;
  var $ = function (id) { return document.getElementById(id); };
  $("title").textContent = t.title;
  $("manual-title").textContent = t.manual;
  $("step1").textContent = t.step1;
  $("step2").textContent = t.step2;
  $("copy").textContent = t.copy;
  $("stores").textContent = t.stores;

  if (!code) {
    $("lead").textContent = t.none;
    $("open").classList.add("hidden");
    $("manual").classList.add("hidden");
    return;
  }
  $("lead").textContent = t.lead;
  var app = "jellyup://c/" + encodeURIComponent(code);
  var open = $("open");
  open.textContent = t.open;
  open.href = app;
  $("code").textContent = code;
  $("copy").addEventListener("click", function () {
    var done = function () { $("copy").textContent = t.copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fallback);
    else fallback();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = code; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });
  // one automatic try on arrival; browsers that block it still have the button
  setTimeout(function () { location.href = app; }, 350);
})();
</script>
</body>
</html>
